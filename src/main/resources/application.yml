spring:
  application:
    name: mumsaqua-api

  profiles:
    active: dev

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  address: 0.0.0.0

# CORS
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://192.168.1.40:3000,http://192.168.1.40:3001

---
# Dev profile - H2 in-memory database (no installation needed)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/mumsaqua-db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

---
# Production profile - PostgreSQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/mumsaqua
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
