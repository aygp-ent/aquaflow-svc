services:
  - type: web
    name: mumsaqua-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mumsaqua-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: mumsaqua-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: mumsaqua-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
    plan: free

databases:
  - name: mumsaqua-db
    plan: free
    databaseName: mumsaqua
    user: mumsaqua_user
